# Production setup: the app behind Caddy, which gets a free HTTPS certificate
# automatically (needed for installing the app on phones and laptops).
#
#   1. Point your domain's DNS A record at this server.
#   2. In .env set DOMAIN, APP_PASSWORD and GEMINI_API_KEY.
#   3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - documents:/app/data/documents
      - vectors:/app/chroma_db
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. docs.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  documents:
  vectors:
  caddy_data:
  caddy_config:
